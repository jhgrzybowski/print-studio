services:
  print-studio:
    build: .
    image: print-studio:latest
    container_name: print-studio
    restart: unless-stopped
    # No published port: the hola-mexico front (~/hola-mexico-deploy-https) owns :80 on the LAN IP
    # and proxies drukarka.local / the bare IP here over the print-studio_default network.
    expose:
      - "8080"
    environment:
      PRINTER_API_UPSTREAM: ${PRINTER_API_UPSTREAM:-http://192.168.100.99:8000}
    mem_limit: 64m
