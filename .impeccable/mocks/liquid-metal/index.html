<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Print Studio — Liquid Metal mockup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b0c0e;
  --side:#121316;
  --panel:#15171a;
  --raise:#1d1f23;
  --raise-2:#24272c;
  --well:#0c0d0f;
  --line:rgba(255,255,255,.06);
  --line-2:rgba(255,255,255,.10);
  --text:#eceef0;
  --text-2:#a4aab1;
  --text-3:#858b93;
  --ok:#86d3a3;
  --fail:#ff8e7e;
  --ink:#0e1012;
  --chrome:linear-gradient(180deg,#ffffff 0%,#e6e9ec 13%,#bcc1c7 40%,#959ba2 50%,#c6cbd0 53%,#eff1f3 78%,#d0d4d9 100%);
  --chrome-soft:linear-gradient(180deg,#f7f8f9 0%,#d9dde1 45%,#b4b9bf 50%,#dfe2e5 56%,#f1f2f4 100%);
  --ease:cubic-bezier(.16,1,.3,1);
  --r:10px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font:400 13px/1.4 Geist,ui-sans-serif,system-ui,sans-serif;font-feature-settings:"tnum" 1;-webkit-font-smoothing:antialiased;overflow:hidden}
::selection{background:#d9dde2;color:var(--ink)}
button,input{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid #cfd4da;outline-offset:2px;border-radius:8px}
*{scrollbar-width:thin;scrollbar-color:#2e3136 transparent}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#2a2d31;border-radius:10px;border:3px solid transparent;background-clip:padding-box}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.i.sm{width:15px;height:15px}

.app{display:grid;grid-template-columns:292px 1fr;height:100vh}

/* ── Sidebar ─────────────────────────── */
.sidebar{background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.brand{height:60px;display:flex;align-items:center;gap:10px;padding:0 12px 0 18px;border-bottom:1px solid var(--line)}
.brand-mark{width:26px;height:26px;flex:none}
.brand-name{font-weight:600;font-size:14px;letter-spacing:-.01em;flex:1}
.icon-btn{width:32px;height:32px;display:grid;place-items:center;border-radius:9px;color:var(--text-2);transition:background .2s,color .2s}
.icon-btn:hover{background:var(--raise);color:var(--text)}
.search{margin:14px 14px 6px;display:flex;align-items:center;gap:8px;height:34px;padding:0 10px;border-radius:var(--r);background:var(--well);box-shadow:inset 0 1px 2px rgba(0,0,0,.55),0 1px 0 rgba(255,255,255,.04);color:var(--text-3)}
.search input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--text)}
.search input::placeholder{color:var(--text-3)}
.search:focus-within{box-shadow:inset 0 1px 2px rgba(0,0,0,.55),0 0 0 1px #6d737b}
kbd{font:500 11px/1 Geist,sans-serif;color:var(--text-3);padding:3px 5px;border-radius:5px;border:1px solid var(--line-2)}
.history{flex:1;overflow:auto;padding:4px 8px 16px}
.group-title{font-size:12px;font-weight:500;color:var(--text-3);padding:16px 10px 6px}
.job{position:relative;width:100%;display:grid;grid-template-columns:30px 1fr auto;gap:12px;align-items:center;padding:8px 10px;border-radius:12px;text-align:left;transition:background .25s var(--ease)}
.job:hover{background:rgba(255,255,255,.035)}
.job[aria-current="true"]{background:var(--raise);box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 0 0 1px rgba(255,255,255,.05),0 6px 14px -8px rgba(0,0,0,.8)}
.job .thumb{width:30px;height:38px;display:grid;place-items:center}
.job .thumb svg{width:100%;height:100%;display:block;filter:drop-shadow(0 1px 2px rgba(0,0,0,.6))}
.job-main{min-width:0;display:flex;flex-direction:column;gap:2px}
.job-name{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.job-meta{color:var(--text-2);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.job-meta.fail{color:var(--fail)}
.job-side{display:grid;place-items:center;width:28px;height:28px}
.job-side .status{color:var(--text-3)}
.job-side .status.fail{color:var(--fail)}
.job-side .reprint{display:none;width:28px;height:28px;border-radius:8px;place-items:center;color:var(--text-2)}
.job-side .reprint:hover{background:var(--raise-2);color:var(--text)}
.job:hover .job-side .status,.job:focus-within .job-side .status{display:none}
.job:hover .job-side .reprint,.job:focus-within .job-side .reprint{display:grid}
.pulse{display:block;width:8px;height:8px;border-radius:50%;background:var(--chrome-soft);box-shadow:0 0 0 0 rgba(220,225,230,.5);animation:pulse 1.6s var(--ease) infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(220,225,230,.45)}100%{box-shadow:0 0 0 9px rgba(220,225,230,0)}}
.job.enter{animation:enter .7s var(--ease)}
@keyframes enter{from{opacity:0;transform:translateY(-8px);filter:blur(4px)}}
.empty-search{padding:28px 12px;color:var(--text-3);text-align:center}

.printer-status{border-top:1px solid var(--line);padding:14px 18px;display:flex;align-items:center;gap:10px;color:var(--text-2);font-size:12px}
.printer-status b{color:var(--text);font-weight:500}
.dot{width:7px;height:7px;border-radius:50%;background:var(--ok);flex:none;box-shadow:0 0 0 3px rgba(134,211,163,.12)}
.dot.busy{background:#d9dde2;box-shadow:0 0 0 3px rgba(217,221,226,.12)}

/* ── Main ────────────────────────────── */
.main{display:flex;flex-direction:column;min-width:0;min-height:0}
.toolbar{height:60px;flex:none;display:flex;align-items:center;gap:6px;padding:0 14px;background:var(--panel);border-bottom:1px solid var(--line);position:relative;z-index:5}
.tb-sep{width:1px;height:22px;background:var(--line-2);margin:0 3px;flex:none}
.toolbar > *{flex:none}
.spacer{flex:1}
.drawer-btn,.scrim{display:none}

.field{height:36px;display:inline-flex;align-items:center;gap:8px;padding:0 10px 0 10px;border-radius:var(--r);background:linear-gradient(180deg,#202327,#1a1c20);box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 0 0 1px rgba(255,255,255,.06),0 1px 2px rgba(0,0,0,.5);color:var(--text);white-space:nowrap;transition:box-shadow .2s,background .2s}
.field:hover{background:linear-gradient(180deg,#25282d,#1e2024)}
.field[aria-expanded="true"]{box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 0 0 1px #6d737b,0 1px 2px rgba(0,0,0,.5)}
.field > .i:first-child{color:var(--text-2)}
.field .chev{color:var(--text-3);width:14px;height:14px}
.field .val{font-weight:500}
.field .dot{width:6px;height:6px;box-shadow:none}

.stepper{height:36px;display:inline-flex;align-items:center;border-radius:var(--r);background:var(--well);box-shadow:inset 0 1px 2px rgba(0,0,0,.6),0 1px 0 rgba(255,255,255,.04);padding:3px;gap:2px}
.stepper .i-lead{color:var(--text-2);margin:0 4px 0 7px}
.stepper button{width:28px;height:30px;border-radius:7px;display:grid;place-items:center;color:var(--text-2);transition:background .2s,color .2s}
.stepper button:hover{background:var(--raise);color:var(--text)}
.stepper button:disabled{opacity:.35;cursor:default;background:none}
.stepper output{min-width:22px;text-align:center;font-weight:600}

.seg{--n:2;--i:0;position:relative;height:36px;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;padding:3px;border-radius:var(--r);background:var(--well);box-shadow:inset 0 1px 2px rgba(0,0,0,.6),0 1px 0 rgba(255,255,255,.04)}
.seg .thumb{position:absolute;top:3px;bottom:3px;left:3px;width:calc((100% - 6px) / var(--n));transform:translateX(calc(100% * var(--i)));border-radius:7px;background:var(--chrome);box-shadow:inset 0 1px 0 #fff,inset 0 -1px 0 rgba(0,0,0,.25),0 1px 2px rgba(0,0,0,.6),0 4px 8px -4px rgba(0,0,0,.8);transition:transform .45s var(--ease)}
.seg button{position:relative;z-index:1;min-width:30px;padding:0 10px;border-radius:7px;display:flex;align-items:center;justify-content:center;gap:6px;color:var(--text-2);font-weight:500;white-space:nowrap;transition:color .3s var(--ease)}
.seg button[aria-pressed="true"]{color:var(--ink)}
.seg button:not([aria-pressed="true"]):hover{color:var(--text)}
.seg.icons button{padding:0 8px}
.swatch{width:9px;height:9px;border-radius:50%;flex:none;box-shadow:inset 0 0 0 1px rgba(0,0,0,.25)}
.swatch.c{background:conic-gradient(#e0532f,#e8b43a,#3f9a6c,#3677c4,#a34fb8,#e0532f)}
.swatch.m{background:linear-gradient(90deg,#1b1d20 50%,#d7dade 50%)}

/* Liquid metal: pointer-tracked specular on every chrome surface */
.metal{position:relative;isolation:isolate;overflow:hidden;color:var(--ink);background:var(--chrome);box-shadow:inset 0 1px 0 #fff,inset 0 -1px 0 rgba(0,0,0,.3),0 1px 1px rgba(0,0,0,.55),0 10px 20px -10px rgba(0,0,0,.9)}
.metal::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:radial-gradient(90px 46px at var(--mx,50%) var(--my,-40%),rgba(255,255,255,.95),rgba(255,255,255,0) 70%);mix-blend-mode:overlay;opacity:.9;transition:opacity .4s}

.print{height:38px;padding:0 8px 0 16px;border-radius:12px;display:inline-flex;align-items:center;gap:10px;font-weight:600;font-size:14px;letter-spacing:-.01em;min-width:128px;justify-content:space-between;transition:transform .15s var(--ease)}
.print::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(112deg,transparent 18%,rgba(255,255,255,.7) 26%,transparent 34%,transparent 58%,rgba(255,255,255,.5) 64%,transparent 70%) 0 0/260% 100%;animation:flow 7s linear infinite}
@keyframes flow{to{background-position:-260% 0}}
.print:active{transform:scale(.97)}
.print .kbd{font-size:11px;font-weight:500;padding:3px 6px;border-radius:6px;background:rgba(14,16,18,.1);box-shadow:inset 0 1px 1px rgba(0,0,0,.15),0 1px 0 rgba(255,255,255,.6)}
.print .label{display:flex;align-items:center;gap:8px}
.print .fill{position:absolute;inset:3px auto 3px 3px;width:0;border-radius:9px;background:var(--chrome);box-shadow:inset 0 1px 0 #fff,4px 0 10px -2px rgba(255,255,255,.35);z-index:-1;transition:width .25s linear}
.print.sending{background:#0c0d0f;box-shadow:inset 0 1px 3px rgba(0,0,0,.8),0 0 0 1px rgba(255,255,255,.08)}
.print.sending::before{display:none}
.print.sending .label,.print.sending .kbd{color:#fff;mix-blend-mode:difference}
.print.sending .kbd{background:none;box-shadow:none}
.print.done{color:var(--ink)}

/* Menus */
.menu{position:absolute;min-width:220px;padding:6px;border-radius:12px;background:#1b1d21;box-shadow:0 0 0 1px rgba(255,255,255,.08),inset 0 1px 0 rgba(255,255,255,.05),0 18px 40px -12px rgba(0,0,0,.9),0 4px 10px rgba(0,0,0,.4);z-index:20;opacity:0;transform:translateY(-4px) scale(.98);transform-origin:top left;pointer-events:none;transition:opacity .18s,transform .3s var(--ease)}
.menu.open{opacity:1;transform:none;pointer-events:auto}
.menu button{width:100%;display:grid;grid-template-columns:18px 1fr auto;gap:10px;align-items:center;padding:8px 10px;border-radius:8px;text-align:left}
.menu button:hover,.menu button:focus-visible{background:var(--raise-2);outline:0}
.menu .check{color:var(--text);visibility:hidden}
.menu button[aria-checked="true"] .check{visibility:visible}
.menu .sub{color:var(--text-3);font-size:12px}
.menu .m-main{display:flex;flex-direction:column;gap:1px}
.menu .m-title{font-weight:500}

/* ── Stage ───────────────────────────── */
.stage{position:relative;flex:1;min-height:0;overflow:auto;background:radial-gradient(ellipse 55% 60% at 50% 40%,#202226 0%,#141518 55%,#0e0f11 100%)}
.doc-meta{position:absolute;top:18px;left:22px;z-index:2;display:flex;align-items:baseline;gap:10px}
.doc-meta .name{font-weight:500;font-size:14px}
.doc-meta .meta{color:var(--text-2);font-size:12px}
.canvas{min-height:100%;min-width:100%;display:grid;place-items:center;padding:72px 80px 110px;width:max-content}
.paper-wrap{position:relative}
.sheet,.ghost{position:absolute;top:0;left:0;transform-origin:0 0;background:#fbfbf9;border-radius:2px}
.sheet{overflow:hidden;box-shadow:0 1px 1px rgba(0,0,0,.35),0 14px 28px -10px rgba(0,0,0,.7),0 40px 70px -30px rgba(0,0,0,.8)}
.ghost{background:#eeeeeb;box-shadow:0 10px 24px -12px rgba(0,0,0,.7);transition:transform .5s var(--ease),opacity .3s}
.sheet .gloss{position:absolute;inset:0;pointer-events:none;background:linear-gradient(125deg,rgba(255,255,255,0) 35%,rgba(255,255,255,.55) 45%,rgba(255,255,255,0) 58%);opacity:0;transition:opacity .5s}
.sheet.glossy .gloss{opacity:.6}
.content{position:absolute;top:0;left:0;transform-origin:0 0;transition:filter .5s var(--ease)}
.sheet.mono .content{filter:grayscale(1) contrast(1.04)}
.sheet.flash{animation:feed .9s var(--ease)}
@keyframes feed{0%{transform:var(--t) translateY(0)}35%{transform:var(--t) translateY(-10px)}100%{transform:var(--t)}}

.stage-bar{position:absolute;left:50%;bottom:20px;transform:translateX(-50%);z-index:3;display:flex;align-items:center;gap:4px;padding:5px;border-radius:14px;background:#1a1c20;box-shadow:0 0 0 1px rgba(255,255,255,.07),inset 0 1px 0 rgba(255,255,255,.05),0 16px 30px -12px rgba(0,0,0,.9)}
.stage-bar .icon-btn{width:30px;height:30px}
.stage-bar .icon-btn:disabled{opacity:.3;cursor:default;background:none}
.stage-bar .num{min-width:52px;text-align:center;font-weight:500}
.stage-bar .summary{padding:0 12px;color:var(--text-2);white-space:nowrap}
.stage-bar .summary b{color:var(--text);font-weight:500}
.stage-bar .zoom{min-width:44px;text-align:center;color:var(--text-2)}
.bar-sep{width:1px;height:18px;background:var(--line-2);margin:0 4px}

/* ── Document content (sample files) ─── */
.doc{font-family:Geist,sans-serif;color:#1c1e21;font-size:13px;line-height:1.55}
.doc h1{font:600 34px/1.1 "Source Serif 4",Georgia,serif;letter-spacing:-.015em;margin:0 0 6px}
.doc h2{font:600 17px/1.2 "Source Serif 4",Georgia,serif;margin:28px 0 10px}
.doc p{margin:0 0 10px;max-width:62ch}
.doc .sub{color:#5d6168;font-size:13px}
.doc .head{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:1.5px solid #1c1e21;padding-bottom:14px;margin-bottom:22px}
.doc .facts{display:grid;grid-template-columns:repeat(4,1fr);gap:0;border-bottom:1px solid #d9dad6;margin-bottom:20px}
.doc .facts div{padding:0 0 14px}
.doc .facts span{display:block;font-size:11px;color:#6b6f75}
.doc .facts b{font:600 20px/1.2 "Source Serif 4",serif}
.doc table{width:100%;border-collapse:collapse;font-size:12.5px}
.doc th{text-align:left;font-weight:500;color:#6b6f75;font-size:11px;border-bottom:1px solid #c9cac6;padding:6px 8px 6px 0}
.doc td{border-bottom:1px solid #e4e4e0;padding:7px 8px 7px 0}
.doc .foot{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:space-between;font-size:11px;color:#7a7e84}
.doc .tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin:8px 0 18px}
.doc .tile i{display:block;height:92px;border-radius:3px;margin-bottom:8px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.doc .tile b{display:block;font-weight:600}
.doc .tile span{font-size:12px;color:#6b6f75}
.doc .form{display:grid;grid-template-columns:1fr 1fr;gap:10px 18px;margin-bottom:18px}
.doc .box{border:1px solid #bfc1bd;border-radius:3px;padding:8px 10px;min-height:48px}
.doc .box span{display:block;font-size:10.5px;color:#6b6f75}
.doc .box b{font-weight:500}
.doc .mono-type{font-family:ui-monospace,Menlo,monospace}

/* ── Responsive ──────────────────────── */
@media (max-width:1520px){.field .collapse-pages{display:none}}
@media (max-width:1360px){.field .val.collapsible{display:none}}
@media (max-width:1180px){.seg .t-hide{display:none}}
@media (max-width:1080px){.stage-bar .summary{display:none}}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .sidebar{position:fixed;inset:0 auto 0 0;width:min(320px,86vw);z-index:30;transform:translateX(-102%);transition:transform .45s var(--ease);box-shadow:30px 0 60px -20px rgba(0,0,0,.8)}
  body.drawer .sidebar{transform:none}
  .scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:25;opacity:0;pointer-events:none;transition:opacity .3s}
  body.drawer .scrim{opacity:1;pointer-events:auto}
  .drawer-btn{display:grid}
  .toolbar{overflow-x:auto;overflow-y:hidden;scrollbar-width:none}
  .toolbar::-webkit-scrollbar{display:none}
  .toolbar > *{flex:none}
  .spacer{flex:0 0 4px}
  .print .kbd{display:none}
  .print{min-width:0;gap:0;padding:0 16px}
  .print-slot{position:sticky;right:0;padding-left:10px;background:linear-gradient(90deg,transparent,var(--panel) 12px)}
  .doc-meta{left:16px;top:14px;flex-direction:column;gap:2px}
  .canvas{padding:70px 24px 96px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="chromeG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset=".3" stop-color="#cfd3d8"/>
      <stop offset=".5" stop-color="#8e949b"/><stop offset=".54" stop-color="#d6dade"/>
      <stop offset=".85" stop-color="#f4f5f6"/><stop offset="1" stop-color="#b5bac0"/>
    </linearGradient>
    <filter id="liquid" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="4" result="n">
        <animate attributeName="baseFrequency" dur="9s" values="0.03;0.05;0.03" repeatCount="indefinite"/>
      </feTurbulence>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="3.2"/>
    </filter>
    <symbol id="i-printer" viewBox="0 0 24 24"><path d="M7 9V4h10v5"/><rect x="3.5" y="9" width="17" height="8" rx="2"/><path d="M7 14h10v6H7z"/></symbol>
    <symbol id="i-paper" viewBox="0 0 24 24"><path d="M14 3.5H7a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8.5z"/><path d="M14 3.5v5h5"/></symbol>
    <symbol id="i-media" viewBox="0 0 24 24"><path d="M12 4 3.5 8.5 12 13l8.5-4.5z"/><path d="m3.5 12.5 8.5 4.5 8.5-4.5"/><path d="m3.5 16 8.5 4.5 8.5-4.5"/></symbol>
    <symbol id="i-copies" viewBox="0 0 24 24"><rect x="8.5" y="8.5" width="11.5" height="11.5" rx="2"/><path d="M15.5 8.5V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v7.5a2 2 0 0 0 2 2h2.5"/></symbol>
    <symbol id="i-portrait" viewBox="0 0 24 24"><rect x="7" y="3.5" width="10" height="17" rx="1.5"/></symbol>
    <symbol id="i-landscape" viewBox="0 0 24 24"><rect x="3.5" y="7" width="17" height="10" rx="1.5"/></symbol>
    <symbol id="i-pages" viewBox="0 0 24 24"><path d="M5 6.5h14M5 12h14M5 17.5h9"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-minus" viewBox="0 0 24 24"><path d="M5 12h14"/></symbol>
    <symbol id="i-chev" viewBox="0 0 24 24"><path d="m6.5 9.5 5.5 5.5 5.5-5.5"/></symbol>
    <symbol id="i-left" viewBox="0 0 24 24"><path d="m14.5 6-6 6 6 6"/></symbol>
    <symbol id="i-right" viewBox="0 0 24 24"><path d="m9.5 6 6 6-6 6"/></symbol>

function jobMeta(j){

function renderHistory(){

  $('#history').innerHTML=days.map(day=>`<div class="group-title">${day}</div>`+list.filter(j=>j.day===day).map(j=>{
    const st=j.status==='done'?`<span class="status">${icon('check')}</span>`:j.status==='failed'?`<span class="status fail">${icon('alert')}</span>`:`<span class="status"><span class="pulse"></span></span>`;
    return `<div class="job${j.fresh?' enter':''}" role="button" tabindex="0" data-id="${j.id}" aria-current="${j.id===state.job}">
      <span class="thumb">${thumb(DOCS[j.doc].type)}</span>
      <span class="job-main"><span class="job-name">${j.v||DOCS[j.doc].name}</span><span class="job-meta${j.status==='failed'?' fail':''}">${jobMeta(j)}</span></span>
      <span class="job-side">${st}<button class="reprint" data-reprint="${j.id}" aria-label="Print again" title="Print again">${icon('reprint')}</button></span>
    </div>`}).join('')).join('');
  JOBS.forEach(j=>delete j.fresh);
}
function renderPrinter(){
  const p=PRINTERS[state.printer], busy=JOBS.some(j=>j.status==='printing'&&j.s.printer===state.printer);
  $('#pdot').className='dot'+(busy?' busy':'');$('#pdot').style.background=p.ok?'':'var(--fail)';
  const queue=JOBS.filter(j=>j.status==='printing').length;
  $('#pstatus').innerHTML=`<span class="dot${busy?' busy':''}" style="${p.ok?'':'background:var(--fail);box-shadow:0 0 0 3px rgba(255,142,126,.12)'}"></span><span><b>${p.name}</b><br>${p.ok?(busy?'Printing':'Ready'):'Offline — check the cable'}${queue?` · ${queue} in queue`:''}</span>`;
}
function renderControls(){
  $$('[data-val]').forEach(el=>{const k=el.dataset.val;el.textContent=k==='printer'?PRINTERS[state.printer].short:k==='media'?MEDIA[state.media].t:k==='pages'?PAGES[state.pages].t:state[k]});
  $$('.seg').forEach(seg=>{const k=seg.dataset.seg,btns=[...seg.querySelectorAll('button')];const i=btns.findIndex(b=>b.dataset.v===state[k]);seg.style.setProperty('--n',btns.length);seg.style.setProperty('--i',i);btns.forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===state[k]))});
  $('#copies').textContent=state.copies;$('#cMinus').disabled=state.copies<=1;$('#cPlus').disabled=state.copies>=99;
  renderPrinter();
}

/* ── Preview ── */
const MM=3.7795;
function renderPreview(){
  const d=DOCS[state.doc];
  let [w,h]=PAPER[state.paper].mm.map(v=>v*MM);
  if(state.orient==='landscape')[w,h]=[h,w];
  const pad=Math.round(Math.min(w,h)*0.075);
  const sheet=$('#sheet'),content=$('#content');
  // content lays out at a design width, then fits the printable area
  const designW=state.orient==='landscape'?1000:700;
  content.style.width=designW+'px';content.style.transform='none';
  content.innerHTML=d.page(state.page)+foot(d.name,`${state.page+1} / ${d.n}`);
  const ft=content.querySelector('.foot');ft.style.position='static';ft.style.marginTop='28px';
  content.style.minHeight='0';
  const ch=content.scrollHeight;
  const s=Math.min((w-pad*2)/designW,(h-pad*2)/ch);
  ft.style.position='';content.style.minHeight=((h-pad*2)/s)+'px';
  content.style.transform=`translate(${pad}px,${pad}px) scale(${s})`;
  sheet.classList.toggle('mono',state.color==='mono');
  sheet.classList.toggle('glossy',state.media==='photo');
  // fit to stage
  const st=$('#stage'),narrow=innerWidth<860;
  const availW=st.clientWidth-(narrow?48:160),availH=st.clientHeight-(narrow?170:190);
  const fit=Math.min(availW/w,availH/h);
  const z=state.zoom??fit;
  const wrap=$('#wrap');wrap.style.width=w*z+'px';wrap.style.height=h*z+'px';
  const t=`scale(${z})`;
  sheet.style.cssText=`width:${w}px;height:${h}px;transform:${t};--t:${t}`;
  const copies=Math.min(state.copies-1,2);
  ['#g1','#g2'].forEach((g,k)=>{const el=$(g);el.style.width=w+'px';el.style.height=h+'px';el.style.opacity=k<copies?1:0;el.style.transform=`translate(${(k+1)*7}px,${(k+1)*7}px) scale(${z})`});
  // meta + bar
  $('#docName').textContent=JOBS.find(j=>j.id===state.job)?.v||d.name;
  const sel=state.pages==='all'?d.n:state.pages==='current'?1:state.pages==='odd'?Math.ceil(d.n/2):Math.floor(d.n/2);
  const sheets=(state.sides==='two'?Math.ceil(sel/2):sel)*state.copies;
  $('#docMeta').textContent=`${d.n} ${d.n>1?'pages':'page'} · ${d.size}`;
  $('#pageNum').textContent=`${state.page+1} / ${d.n}`;
  $('#prev').disabled=state.page===0;$('#next').disabled=state.page>=d.n-1;
  $('#summary').innerHTML=`<b>${sheets} ${sheets===1?'sheet':'sheets'}</b> · ${state.paper} ${MEDIA[state.media].t.toLowerCase()} · ${state.color==='mono'?'Mono':'Color'} · ${state.sides==='two'?'2-sided':'1-sided'}`;
  $('#zoomVal').textContent=Math.round(z*100)+'%';
}
function render(){renderControls();renderPreview()}

/* ── Interactions ── */
function selectJob(id){
  const j=JOBS.find(x=>x.id===id);if(!j)return;
  Object.assign(state,j.s,{job:id,doc:j.doc,page:0,zoom:null,pages:'all'});
  renderHistory();render();document.body.classList.remove('drawer');
}
$('#history').addEventListener('click',e=>{
  const r=e.target.closest('[data-reprint]');if(r){e.stopPropagation();selectJob(r.dataset.reprint);doPrint();return}
  const j=e.target.closest('.job');if(j)selectJob(j.dataset.id);
});
$('#history').addEventListener('keydown',e=>{const j=e.target.closest('.job');if(j&&(e.key==='Enter'||e.key===' ')&&e.target===j){e.preventDefault();selectJob(j.dataset.id)}});
$('#q').addEventListener('input',renderHistory);
$$('.seg').forEach(seg=>seg.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;state[seg.dataset.seg]=b.dataset.v;render()}));
$('#cMinus').onclick=()=>{state.copies=Math.max(1,state.copies-1);render()};
$('#cPlus').onclick=()=>{state.copies=Math.min(99,state.copies+1);render()};
$('#prev').onclick=()=>{state.page=Math.max(0,state.page-1);renderPreview()};
$('#next').onclick=()=>{state.page=Math.min(DOCS[state.doc].n-1,state.page+1);renderPreview()};
const curZoom=()=>parseFloat($('#zoomVal').textContent)/100;
$('#zIn').onclick=()=>{state.zoom=Math.min(3,curZoom()*1.2);renderPreview()};
$('#zOut').onclick=()=>{state.zoom=Math.max(.15,curZoom()/1.2);renderPreview()};
$('#zFit').onclick=()=>{state.zoom=null;renderPreview()};
addEventListener('resize',renderPreview);
$('#drawerBtn').onclick=()=>document.body.classList.add('drawer');
$('#scrim').onclick=()=>document.body.classList.remove('drawer');

/* Menus */
const menu=$('#menu');let menuFor=null;
const MENUS={
  printer:()=>Object.entries(PRINTERS).map(([k,p])=>[k,p.name,p.sub]),
  paper:()=>Object.entries(PAPER).map(([k,p])=>[k,k,p.sub]),
  media:()=>Object.entries(MEDIA).map(([k,m])=>[k,m.t,m.sub]),
  pages:()=>Object.entries(PAGES).map(([k,m])=>[k,m.t,'']),
};
function openMenu(btn){
  if(menuFor===btn){closeMenu();return}
  closeMenu();menuFor=btn;const key=btn.dataset.menu;
  menu.innerHTML=MENUS[key]().map(([v,t,sub])=>`<button role="menuitemradio" aria-checked="${state[key]===v}" data-v="${v}"><svg class="i sm check"><use href="#i-check"/></svg><span class="m-main"><span class="m-title">${t}</span>${sub?`<span class="sub">${sub}</span>`:''}</span></button>`).join('');
  const r=btn.getBoundingClientRect();
  menu.style.left=Math.min(r.left,innerWidth-240)+'px';menu.style.top=r.bottom+6+'px';
  btn.setAttribute('aria-expanded','true');menu.classList.add('open');
  (menu.querySelector('[aria-checked="true"]')||menu.querySelector('button')).focus({preventScroll:true});
  menu.onclick=e=>{const b=e.target.closest('button');if(!b)return;state[key]=b.dataset.v;if(key==='printer'){const p=b.dataset.v;if(p==='selphy'){state.paper='4×6';state.media='photo'}if(p==='zebra'){state.paper='4×6';state.media='labels';state.color='mono'}}closeMenu(true);render()};
}
function closeMenu(refocus){if(!menuFor)return;menuFor.setAttribute('aria-expanded','false');if(refocus)menuFor.focus();menuFor=null;menu.classList.remove('open')}
$$('[data-menu]').forEach(b=>b.addEventListener('click',e=>{e.stopPropagation();openMenu(b)}));
document.addEventListener('click',e=>{if(!menu.contains(e.target))closeMenu()});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){closeMenu(true);document.body.classList.remove('drawer')}
  if(menuFor&&(e.key==='ArrowDown'||e.key==='ArrowUp')){e.preventDefault();const items=[...menu.querySelectorAll('button')];let i=items.indexOf(document.activeElement);i=(i+(e.key==='ArrowDown'?1:-1)+items.length)%items.length;items[i].focus()}
  if((e.metaKey||e.ctrlKey)&&e.key==='p'){e.preventDefault();doPrint()}
  if((e.metaKey||e.ctrlKey)&&e.key==='k'){e.preventDefault();$('#q').focus()}
});

/* Liquid metal: highlight follows the pointer */
document.addEventListener('pointermove',e=>{
  $$('.metal,.seg .thumb').forEach(el=>{const r=el.getBoundingClientRect();el.style.setProperty('--mx',((e.clientX-r.left)/r.width*100).toFixed(1)+'%');el.style.setProperty('--my',((e.clientY-r.top)/r.height*100).toFixed(1)+'%')});
},{passive:true});

/* Print */
let printing=false;
function doPrint(){
  if(printing)return;
  const btn=$('#printBtn'),label=btn.querySelector('.label'),fill=btn.querySelector('.fill');
  if(!PRINTERS[state.printer].ok){label.textContent='Printer offline';setTimeout(()=>label.textContent='Print',1800);return}
  printing=true;btn.classList.add('sending');label.textContent='Sending';
  let p=0;const tick=setInterval(()=>{p=Math.min(1,p+.07+Math.random()*.06);fill.style.width=`calc((100% - 6px) * ${p})`;if(p>=1){clearInterval(tick);finish()}},120);
  function finish(){
    setTimeout(()=>{
      btn.classList.remove('sending');fill.style.transition='none';fill.style.width='0';requestAnimationFrame(()=>fill.style.transition='');
      label.innerHTML=`${icon('check')} Sent`;
      const sheet=$('#sheet');sheet.classList.remove('flash');void sheet.offsetWidth;sheet.classList.add('flash');
      const d=new Date(),id='n'+d.getTime();
      JOBS.unshift({id,doc:state.doc,day:'Today',time:d.toTimeString().slice(0,5),status:'printing',progress:`1 of ${state.copies}`,fresh:true,s:{printer:state.printer,paper:state.paper,media:state.media,color:state.color,orient:state.orient,sides:state.sides,copies:state.copies},v:JOBS.find(j=>j.id===state.job)?.v});
      state.job=id;renderHistory();renderPrinter();
      setTimeout(()=>{const j=JOBS.find(x=>x.id===id);if(j){j.status='done';renderHistory();renderPrinter()}},5200);
      setTimeout(()=>{label.textContent='Print';printing=false},1600);
    },180);
  }
}
$('#printBtn').onclick=doPrint;

/* demo: the in-flight job finishes on its own */
setTimeout(()=>{const j=JOBS.find(x=>x.id==='j0');j.progress='2 of 2';renderHistory()},3500);
setTimeout(()=>{const j=JOBS.find(x=>x.id==='j0');j.status='done';renderHistory();renderPrinter()},8000);

if(!matchMedia('(prefers-reduced-motion: reduce)').matches)document.querySelector('.mark-shape').setAttribute('filter','url(#liquid)');
renderHistory();render();
document.fonts?.ready.then(renderPreview);
</script>
</body>
</html>
